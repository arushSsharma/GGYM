<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metabolic Calculator — GGYM</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
  <div class="app-shell">
    
    <!-- Topbar -->
    <header class="topbar">
      <a href="dashboard.html" class="brand-wrap" aria-label="GGYM Home">
        <div class="brand-mark">G</div>
        <span class="brand-text">GGYM</span>
      </a>
      <a href="profile.html" class="icon-btn" aria-label="Open Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
    </header>

    <!-- Main Content -->
    <main class="page-content">
      
      <section class="calculator-header">
        <span class="eyebrow">METABOLIC ENGINE</span>
        <h1 class="headline-page">Caloric Targets</h1>
        <p class="text-muted">Compute your BMR, TDEE, and daily macro targets.</p>
      </section>

      <!-- Live Calculated Output Indicators -->
      <section class="calculator-results-grid" aria-label="Calculated Targets">
        <div class="calc-result-card">
          <span class="calc-result-label">BMI</span>
          <div class="calc-result-val text-num" id="calc-bmi-val">--</div>
          <span class="calc-result-sub" id="calc-bmi-cat">--</span>
        </div>
        <div class="calc-result-card">
          <span class="calc-result-label">BMR</span>
          <div class="calc-result-val text-num" id="calc-bmr-val">--</div>
          <span class="calc-result-sub">kcal/day</span>
        </div>
        <div class="calc-result-card">
          <span class="calc-result-label">Target</span>
          <div class="calc-result-val text-num" id="calc-tdee-val">--</div>
          <span class="calc-result-sub">kcal/day</span>
        </div>
      </section>

      <!-- Macronutrient Target Estimates -->
      <section class="card macro-distribution-card">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <h2 class="headline-section" style="font-size: 0.95rem;">Suggested Daily Macros</h2>
          <span class="text-muted" style="font-size: 0.72rem;" id="macro-split-ratio">40P / 35C / 25F</span>
        </div>
        <div class="macro-split-grid">
          <div class="macro-box">
            <div class="lbl">Protein</div>
            <div class="grams text-num" id="macro-protein-g">-- g</div>
            <div class="cal" id="macro-protein-cal">-- kcal</div>
          </div>
          <div class="macro-box">
            <div class="lbl">Carbs</div>
            <div class="grams text-num" id="macro-carbs-g">-- g</div>
            <div class="cal" id="macro-carbs-cal">-- kcal</div>
          </div>
          <div class="macro-box">
            <div class="lbl">Fats</div>
            <div class="grams text-num" id="macro-fats-g">-- g</div>
            <div class="cal" id="macro-fats-cal">-- kcal</div>
          </div>
        </div>
      </section>

      <!-- Calculation Adjuster Form -->
      <form id="calculator-form" class="card" novalidate>
        <div class="grid-2">
          <div class="form-group">
            <label for="calc-age" class="form-label">Age</label>
            <input type="number" id="calc-age" class="form-input" min="14" max="100" required>
          </div>
          <div class="form-group">
            <label for="calc-gender" class="form-label">Gender</label>
            <select id="calc-gender" class="form-select">
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="calc-height" class="form-label">Height (cm)</label>
            <input type="number" step="0.1" id="calc-height" class="form-input" min="100" max="250" required>
          </div>
          <div class="form-group">
            <label for="calc-weight" class="form-label">Weight (kg)</label>
            <input type="number" step="0.1" id="calc-weight" class="form-input" min="30" max="300" required>
          </div>
        </div>

        <div class="form-group">
          <label for="calc-goal" class="form-label">Goal</label>
          <select id="calc-goal" class="form-select">
            <option value="general_fitness">General Fitness (Maintenance)</option>
            <option value="build_muscle">Build Muscle (10% Hypertrophy Surplus)</option>
            <option value="strength">Strength & Power (5% Surplus)</option>
            <option value="fat_loss">Fat Loss (20% Deficit)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="calc-activity" class="form-label">Activity Level</label>
          <select id="calc-activity" class="form-select">
            <option value="sedentary">Sedentary (Little or no exercise)</option>
            <option value="light">Lightly Active (1–3 days/week)</option>
            <option value="moderate">Moderately Active (3–5 days/week)</option>
            <option value="active">Active (6–7 days/week)</option>
            <option value="very_active">Very Active (Physical labor / 2x training)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-sync-profile" style="margin-top: 10px;">
          Update Profile Metrics
        </button>
      </form>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Bottom Navigation">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>
      <a href="workout.html" class="nav-item">
        <span class="nav-icon">🏋️</span>
        <span>Workout</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">🕘</span>
        <span>History</span>
      </a>
      <a href="progress.html" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Progress</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script type="module">
    import { initAuthGuard } from './js/auth-guard.js';
    import { getUserProfile, updateUserProfile } from './js/firestore.js';
    import { calculateBMI, calculateBMR, calculateTargetCalories } from './js/calculator.js';
    import { showToast } from './js/utils.js';

    let activeUser = null;

    const ageInput = document.getElementById('calc-age');
    const genderSelect = document.getElementById('calc-gender');
    const heightInput = document.getElementById('calc-height');
    const weightInput = document.getElementById('calc-weight');
    const goalSelect = document.getElementById('calc-goal');
    const activitySelect = document.getElementById('calc-activity');

    const bmiVal = document.getElementById('calc-bmi-val');
    const bmiCat = document.getElementById('calc-bmi-cat');
    const bmrVal = document.getElementById('calc-bmr-val');
    const tdeeVal = document.getElementById('calc-tdee-val');

    const proteinG = document.getElementById('macro-protein-g');
    const proteinCal = document.getElementById('macro-protein-cal');
    const carbsG = document.getElementById('macro-carbs-g');
    const carbsCal = document.getElementById('macro-carbs-cal');
    const fatsG = document.getElementById('macro-fats-g');
    const fatsCal = document.getElementById('macro-fats-cal');
    const splitRatioLabel = document.getElementById('macro-split-ratio');

    const form = document.getElementById('calculator-form');
    const syncBtn = document.getElementById('btn-sync-profile');

    initAuthGuard(async (user) => {
      if (!user) return;
      activeUser = user;

      try {
        const profile = await getUserProfile(user.uid);
        if (profile) {
          ageInput.value = profile.age || 28;
          genderSelect.value = profile.gender || 'male';
          heightInput.value = profile.heightCm || 182.9;
          weightInput.value = profile.weightKg || 73.4;
          goalSelect.value = profile.fitnessGoal || 'general_fitness';
          activitySelect.value = profile.activityLevel || 'moderate';
        }
        recalculate();
      } catch (err) {
        console.error('Error fetching profile for calculator:', err);
      }
    });

    function recalculate() {
      const age = parseInt(ageInput.value, 10) || 0;
      const gender = genderSelect.value;
      const height = parseFloat(heightInput.value) || 0;
      const weight = parseFloat(weightInput.value) || 0;
      const goal = goalSelect.value;
      const activity = activitySelect.value;

      const { bmi, category } = calculateBMI(weight, height);
      const bmr = calculateBMR(weight, height, age, gender);
      const targetCalories = calculateTargetCalories(bmr, activity, goal);

      bmiVal.textContent = bmi > 0 ? bmi : '--';
      bmiCat.textContent = bmi > 0 ? category : '--';
      bmrVal.textContent = bmr > 0 ? bmr.toLocaleString() : '--';
      tdeeVal.textContent = targetCalories > 0 ? targetCalories.toLocaleString() : '--';

      // Compute Macro Split
      computeMacros(targetCalories, goal);

      return { bmi, bmr, targetCalories };
    }

    function computeMacros(totalCalories, goal) {
      if (!totalCalories || totalCalories <= 0) {
        proteinG.textContent = '-- g';
        carbsG.textContent = '-- g';
        fatsG.textContent = '-- g';
        return;
      }

      let pRatio = 0.30;
      let cRatio = 0.45;
      let fRatio = 0.25;

      if (goal === 'fat_loss') {
        pRatio = 0.40;
        cRatio = 0.35;
        fRatio = 0.25;
        splitRatioLabel.textContent = '40P / 35C / 25F (High Protein)';
      } else if (goal === 'build_muscle' || goal === 'strength') {
        pRatio = 0.30;
        cRatio = 0.50;
        fRatio = 0.20;
        splitRatioLabel.textContent = '30P / 50C / 20F (Fuel Surplus)';
      } else {
        splitRatioLabel.textContent = '30P / 45C / 25F (Balanced)';
      }

      const pCal = totalCalories * pRatio;
      const cCal = totalCalories * cRatio;
      const fCal = totalCalories * fRatio;

      proteinG.textContent = `${Math.round(pCal / 4)} g`;
      proteinCal.textContent = `${Math.round(pCal)} kcal`;

      carbsG.textContent = `${Math.round(cCal / 4)} g`;
      carbsCal.textContent = `${Math.round(cCal)} kcal`;

      fatsG.textContent = `${Math.round(fCal / 9)} g`;
      fatsCal.textContent = `${Math.round(fCal)} kcal`;
    }

    [ageInput, genderSelect, heightInput, weightInput, goalSelect, activitySelect].forEach(input => {
      input.addEventListener('input', recalculate);
      input.addEventListener('change', recalculate);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeUser) return;

      const { bmi, bmr, targetCalories } = recalculate();

      try {
        syncBtn.disabled = true;
        syncBtn.textContent = 'Syncing...';

        await updateUserProfile(activeUser.uid, {
          age: parseInt(ageInput.value, 10),
          gender: genderSelect.value,
          heightCm: parseFloat(heightInput.value),
          weightKg: parseFloat(weightInput.value),
          fitnessGoal: goalSelect.value,
          activityLevel: activitySelect.value,
          bmi,
          bmr,
          dailyCalories: targetCalories
        });

        showToast('Profile & targets updated successfully', 'success');
      } catch (err) {
        console.error('Error updating profile from calculator:', err);
        showToast('Failed to save metrics', 'error');
      } finally {
        syncBtn.disabled = false;
        syncBtn.textContent = 'Update Profile Metrics';
      }
    });
  </script>
</body>
</html>
