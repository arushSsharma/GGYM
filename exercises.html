<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Exercise Library — GGYM</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/exercises.css">
</head>
<body>
  <div class="app-shell">
    
    <!-- Topbar -->
    <header class="topbar">
      <a href="workout.html" class="brand-wrap" aria-label="Back to Routine">
        <div class="brand-mark">G</div>
        <span class="brand-text">GGYM</span>
      </a>
      <a href="workout.html" class="icon-btn" aria-label="Go to Active Routine">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </header>

    <!-- Main Content -->
    <main class="page-content">
      
      <section class="library-header">
        <span class="eyebrow">MOVEMENT DIRECTORY</span>
        <h1 class="headline-page">Exercise Library</h1>
        <p class="text-muted">Explore setup cues, execution mechanics, and select exercises for your custom split.</p>
      </section>

      <!-- Search Input -->
      <div class="search-box-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="search" 
          id="exercise-search-input" 
          class="form-input search-input" 
          placeholder="Search by exercise, muscle, or barbell..." 
          autocomplete="off"
        >
        <button type="button" class="search-clear-btn" id="btn-clear-search" aria-label="Clear search input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Category Filter Tabs -->
      <nav class="filter-scroll-container" id="category-filter-chips" aria-label="Filter exercises by muscle group">
        <button type="button" class="filter-chip active" data-filter="All">All Movements</button>
        <button type="button" class="filter-chip" data-filter="Chest">Chest</button>
        <button type="button" class="filter-chip" data-filter="Back">Back</button>
        <button type="button" class="filter-chip" data-filter="Shoulders">Shoulders</button>
        <button type="button" class="filter-chip" data-filter="Legs">Legs</button>
        <button type="button" class="filter-chip" data-filter="Arms">Arms</button>
        <button type="button" class="filter-chip" data-filter="Core">Core</button>
        <button type="button" class="filter-chip" data-filter="Strength">Compound</button>
      </nav>

      <!-- Exercise List Counter -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: var(--font-label); color: var(--muted);">
        <span id="results-count-label">Loading library...</span>
        <a href="workout.html" class="text-muted" style="text-decoration: underline;">View Current Routine</a>
      </div>

      <!-- Exercise Cards Container -->
      <section class="library-list" id="exercises-container" aria-live="polite">
        <!-- Rendered via js/exercises.js -->
      </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Bottom Navigation">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>
      <a href="workout.html" class="nav-item active" aria-current="page">
        <span class="nav-icon">🏋️</span>
        <span>Workout</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">🕘</span>
        <span>History</span>
      </a>
      <a href="progress.html" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Progress</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script type="module" src="js/exercises.js"></script>
</body>
</html>
