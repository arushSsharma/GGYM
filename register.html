<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Create Account — GGYM</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="app-shell">
    <main class="page-content">
      <div class="auth-container">
        
        <div class="auth-header">
          <a href="index.html" class="auth-brand" aria-label="GGYM Home">
            <div class="brand-mark">G</div>
            <span class="brand-text">GGYM</span>
          </a>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Start tracking your strength and consistency.</p>
        </div>

        <div class="auth-card">
          <button type="button" class="btn btn-google" id="btn-google-register">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign up with Google
          </button>

          <div class="auth-divider">or email</div>

          <form id="register-form" novalidate>
            <div class="form-group">
              <label for="reg-email" class="form-label">Email Address</label>
              <input 
                type="email" 
                id="reg-email" 
                class="form-input" 
                placeholder="name@example.com" 
                required 
                autocomplete="email"
              >
            </div>

            <div class="form-group">
              <label for="reg-password" class="form-label">Password</label>
              <div class="password-input-wrap">
                <input 
                  type="password" 
                  id="reg-password" 
                  class="form-input" 
                  placeholder="At least 6 characters" 
                  required 
                  minlength="6"
                  autocomplete="new-password"
                >
                <button type="button" class="password-toggle-btn" id="toggle-reg-password" aria-label="Toggle password visibility">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="reg-password-confirm" class="form-label">Confirm Password</label>
              <input 
                type="password" 
                id="reg-password-confirm" 
                class="form-input" 
                placeholder="Re-enter password" 
                required 
                autocomplete="new-password"
              >
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-submit-reg" style="margin-top: 10px;">
              Create Fitness Account
            </button>
          </form>
        </div>

        <div class="auth-links">
          <p class="text-muted">Already registered? <a href="login.html">Sign in</a></p>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { initAuthGuard } from './js/auth-guard.js';
    import { registerWithEmail, loginWithGoogle } from './js/auth.js';
    import { showToast } from './js/utils.js';

    // Route guard check
    initAuthGuard();

    const form = document.getElementById('register-form');
    const emailInput = document.getElementById('reg-email');
    const passwordInput = document.getElementById('reg-password');
    const passwordConfirmInput = document.getElementById('reg-password-confirm');
    const submitBtn = document.getElementById('btn-submit-reg');
    const googleBtn = document.getElementById('btn-google-register');
    const togglePasswordBtn = document.getElementById('toggle-reg-password');

    // Password visibility toggle
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      passwordConfirmInput.setAttribute('type', type);
    });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = passwordConfirmInput.value;

      if (!email || !password || !confirmPassword) {
        showToast('Please complete all fields', 'warning');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'warning');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        await registerWithEmail(email, password);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Fitness Account';
      }
    });

    // Google Sign up
    googleBtn.addEventListener('click', async () => {
      try {
        googleBtn.disabled = true;
        await loginWithGoogle();
      } catch (err) {
        googleBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
